<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>3D Model Viewer</title>
    <style>
        body { margin: 0; }
        #canvas-container {
            width: 100vw;
            height: 100vh;
        }
        #loading-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
            font-family: Arial, sans-serif;
            z-index: 1000;
        }
        #model-selector {
            position: fixed;
            top: 20px;
            left: 20px;
            z-index: 100;
            padding: 5px;
            background: rgba(255, 255, 255, 0.8);
            border-radius: 4px;
        }
          #lighting-control {
            position: fixed;
            top: 58px;
            left: 20px;
            z-index: 100;
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 8px 10px;
            color: #222;
            background: rgba(255, 255, 255, 0.8);
            border-radius: 4px;
            font: 14px Arial, sans-serif;
          }
          #brightness-slider {
            width: 130px;
          }
    </style>
  </head>
  <body>
    <select id="model-selector">
        <option value="https://raw.githubusercontent.com/wxcvbnlmjk/three-viewer/main/src/models/fourviere..glb">Lyon</option>
        <option value="https://raw.githubusercontent.com/wxcvbnlmjk/three-viewer/main/src/models/mayor.glb">Marseille</option>
        <option value="https://raw.githubusercontent.com/wxcvbnlmjk/three-viewer/main/src/models/amiens.glb">Amiens</option>
        <option value="https://raw.githubusercontent.com/wxcvbnlmjk/three-viewer/main/src/models/basilique.glb">Basilique</option>
        <option value="https://raw.githubusercontent.com/wxcvbnlmjk/three-viewer/main/src/models/museelumiere.glb">Musee Lumiere</option>
        <option value="https://raw.githubusercontent.com/wxcvbnlmjk/three-viewer/main/src/models/chateau_tripo_meshopt.glb">Chateau</option>
    </select>
      <label id="lighting-control" for="brightness-slider">
        Luminosite
        <input id="brightness-slider" type="range" min="0" max="2" step="0.05" value="1" />
        <output id="brightness-value" for="brightness-slider">100%</output>
      </label>
    <div id="loading-overlay">
        <div class="progress-text">Loading: 0%</div>
    </div>
    <div id="canvas-container"></div>
    <script type="module" src="/src/scripts/viewer.js"></script>
  </body>
</html>
